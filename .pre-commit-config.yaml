repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict
      - id: check-toml

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.14
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]

  - repo: local
    hooks:
      # Lance via `uv run --frozen` et non `.venv/Scripts/python.exe` : pre-commit
      # decoupe `entry` avec shlex en mode POSIX, qui avale les backslashes, et
      # CreateProcess ne resout pas un chemin relatif a slashes. Les deux formes
      # Windows echouaient donc en [WinError 2] sans jamais lancer le processus
      # (duree mesuree 0.02s). `uv run --frozen` utilise le venv du projet et les
      # versions figees par uv.lock — meme convention que _template du workspace kaggle.
      - id: lock-sync-check
        name: requirements.lock sync vs pyproject.toml
        entry: uv run --frozen python scripts/check_lock_sync.py
        language: system
        stages: [pre-push]
        pass_filenames: false

      - id: pytest-sanity
        name: pytest sanity asserts
        entry: uv run --frozen pytest tests/ -q
        language: system
        stages: [pre-push]
        pass_filenames: false
